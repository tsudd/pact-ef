# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: pact-ef-test-main

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      env:
        # AllConsumerSnapshots_AreCompatibleWithCurrentSchema reads PACTEF_SNAPSHOT_PATHS and
        # must pass, so it gets the compatible consumer. BrokenConsumer_ShouldFailWithBreakingMigration
        # reads CUSTOM_SNAPSHOT_PATHS and expects a verification failure, so it gets the broken one.
        PACTEF_SNAPSHOT_PATHS: ${{ github.workspace }}/samples/SampleConsumer.Tests/pactef-snapshots
        CUSTOM_SNAPSHOT_PATHS: ${{ github.workspace }}/samples/BrokenSampleConsumer.Tests/pactef-snapshots
      run: dotnet test --no-build --verbosity normal
